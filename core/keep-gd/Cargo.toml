[package]
name = "keep-gd"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
description = "Thin godot-rust GDExtension bridge for Keepwright"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
godot = { version = "=0.5.6", features = ["api-4-7"] }
keep-core = { path = "../keep-core" }
serde_json = "1"
